<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rock, Paper, Scissors</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="game">
            <h1>Rock, Paper, Scissors</h1>

            <section class="moves">
                <p class="section-label">Choose your move:</p>
                <div class="button-row">
                    <button id="Rock" class="move-btn">Rock</button>
                    <button id="Paper" class="move-btn">Paper</button>
                    <button id="Scissors" class="move-btn">Scissors</button>
                </div>
                <button id="play-round" class="action-btn">Play Round</button>
            </section>

            <section class="board">
                <p>Computer's Move: <span id="computer-move"></span></p>
                <div class="scores">
                    <p>Player Score: <span id="player-score">0</span></p>
                    <p>Computer Score: <span id="computer-score">0</span></p>
                </div>
                <p class="result">Result: <span id="result"></span></p>
            </section>

            <button id="reset" class="reset-btn">Reset Game</button>
        </main>

        <script src="main.js"></script>
    </body>
</html>
